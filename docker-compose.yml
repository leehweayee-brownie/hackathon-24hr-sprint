name: vendor-passport

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-vp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vp}
      POSTGRES_DB: ${POSTGRES_DB:-vendor_passport}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vp} -d ${POSTGRES_DB:-vendor_passport}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: bitnamilegacy/minio:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_DEFAULT_BUCKETS: vendor-passport
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - miniodata:/bitnami/minio/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/minio/health/live || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    profiles: ["app"]
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    env_file: apps/api/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vp}:${POSTGRES_PASSWORD:-vp}@postgres:5432/${POSTGRES_DB:-vendor_passport}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      PORT: "4000"
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  worker:
    profiles: ["app"]
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: ["node", "dist/worker.js"]
    env_file: apps/api/.env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-vp}:${POSTGRES_PASSWORD:-vp}@postgres:5432/${POSTGRES_DB:-vendor_passport}
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
    depends_on:
      - api

  web:
    profiles: ["app"]
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "8888:8888"
    depends_on:
      - api

volumes:
  pgdata:
  redisdata:
  miniodata:
